name: CI

on:
  push:
  pull_request:

jobs:
  build-en-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # De servertests maken per testklasse een eigen database aan op deze server.
      BOEKERHOUDEN_TEST_DB: Host=localhost;Username=boekerhouden;Password=boekerhouden-dev
      # De PDF-test gebruikt de Chrome van de runner; daar werkt de sandbox van Chrome niet.
      Pdf__ZonderSandbox: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boekerhouden
          POSTGRES_PASSWORD: boekerhouden-dev
          POSTGRES_DB: boekerhouden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boekerhouden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Boekerhouden.slnx
      - run: dotnet build Boekerhouden.slnx --no-restore
      - run: dotnet format Boekerhouden.slnx --verify-no-changes --no-restore
      - run: dotnet test Boekerhouden.slnx --no-build
      # Het administratiepakket nog eens op SQLite, zoals in de Windows-app.
      - run: dotnet test tests/Boekerhouden.Administratie.Tests --no-build
        env:
          BOEKERHOUDEN_TEST_SQLITE: "1"

  # De Windows-app voor de tests: een zip met een eigen venster (BlazorWebView), SQLite en zonder inloggen.
  windows-app:
    needs: build-en-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: scripts/maak-windows-app.sh publiceer
      - uses: actions/upload-artifact@v4
        with:
          name: Boekerhouden-Administratie-win-x64
          path: publiceer/Boekerhouden-Administratie-win-x64.zip
          retention-days: 30

  # Proef op Windows: de app opent zijn venster en toont het eerste scherm (met een schermafdruk als bewijs).
  windows-app-proef:
    needs: windows-app
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Boekerhouden-Administratie-win-x64
      - shell: pwsh
        run: |
          Expand-Archive Boekerhouden-Administratie-win-x64.zip -DestinationPath app
          $map = Join-Path $env:RUNNER_TEMP "proef"
          $proces = Start-Process "app\Boekerhouden Administratie\Boekerhouden.Administratie.Windows.exe" -ArgumentList "--proef", "`"$map`"" -PassThru
          if (-not $proces.WaitForExit(180000)) { Stop-Process $proces -Force; throw "De Windows-app reageerde niet." }
          if (Test-Path "$map\fouten.log") { Get-Content "$map\fouten.log" }
          if (Test-Path "$map\proef.txt") { Get-Content "$map\proef.txt" }
          if ($proces.ExitCode -ne 0) { throw "De Windows-app toonde het eerste scherm niet (code $($proces.ExitCode))." }
          Write-Host "De Windows-app opent en toont de administraties."
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-proef
          path: ${{ runner.temp }}/proef/proef*
          if-no-files-found: ignore
