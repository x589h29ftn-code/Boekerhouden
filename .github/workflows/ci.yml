name: CI

on:
  push:
  pull_request:

jobs:
  build-en-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # De servertests maken per testklasse een eigen database aan op deze server.
      BOEKERHOUDEN_TEST_DB: Host=localhost;Username=boekerhouden;Password=boekerhouden-dev
      # De PDF-test gebruikt de Chrome van de runner; daar werkt de sandbox van Chrome niet.
      Pdf__ZonderSandbox: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boekerhouden
          POSTGRES_PASSWORD: boekerhouden-dev
          POSTGRES_DB: boekerhouden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boekerhouden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Boekerhouden.slnx
      - run: dotnet build Boekerhouden.slnx --no-restore
      - run: dotnet format Boekerhouden.slnx --verify-no-changes --no-restore
      - run: dotnet test Boekerhouden.slnx --no-build

  # De Windows-app voor de tests: een zip met de app, PostgreSQL voor Windows en bureaublad.json (scripts/windows).
  windows-app:
    needs: build-en-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: scripts/maak-windows-app.sh publiceer
      - uses: actions/upload-artifact@v4
        with:
          name: Boekerhouden-Administratie-win-x64
          path: publiceer/Boekerhouden-Administratie-win-x64.zip
          retention-days: 30

  # Proef op Windows: de app start met de meegeleverde PostgreSQL en toont de pagina voor het eerste account.
  windows-app-proef:
    needs: windows-app
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Boekerhouden-Administratie-win-x64
      - shell: pwsh
        env:
          Bureaublad__Venster: Nee
          Bureaublad__Gegevensmap: ${{ runner.temp }}\boekerhouden
        run: |
          Expand-Archive Boekerhouden-Administratie-win-x64.zip -DestinationPath app
          $exe = "app\Boekerhouden Administratie\Boekerhouden.Administratie.exe"
          $proces = Start-Process $exe -PassThru -RedirectStandardOutput uit.txt -RedirectStandardError fout.txt
          $pagina = $null
          for ($i = 0; $i -lt 90 -and -not $pagina; $i++) {
            Start-Sleep -Seconds 2
            try { $pagina = (Invoke-WebRequest http://127.0.0.1:5090/eerste-gebruiker -UseBasicParsing).Content } catch { }
          }
          Get-Content uit.txt, fout.txt
          Stop-Process $proces -Force
          & "app\Boekerhouden Administratie\pgsql\bin\pg_ctl.exe" stop -D "$env:Bureaublad__Gegevensmap\database" -m fast
          if (-not $pagina -or $pagina -notmatch "Eerste gebruiker") { throw "De Windows-app startte niet." }
          Write-Host "De Windows-app start en toont de pagina voor het eerste account."

