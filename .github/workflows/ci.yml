name: CI

on:
  push:
  pull_request:

jobs:
  build-en-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Boekerhouden.slnx
      - run: dotnet build Boekerhouden.slnx --no-restore
      - run: dotnet format Boekerhouden.slnx --verify-no-changes --no-restore
      - run: dotnet test Boekerhouden.slnx --no-build
